name: Backend CI/CD

on:
  push:
    branches: [ main, dev ]  # Triggers on pushes to main or dev
  pull_request:
    branches: [ main, dev ]  # Also triggers on PRs
  workflow_dispatch:          # Manual trigger

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout the repo
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2️⃣ Set up Node.js
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18

      # 3️⃣ Install backend dependencies
      - name: Install backend dependencies
        run: npm ci --prefix backend

      # 4️⃣ Run backend tests
      - name: Run backend tests
        run: npm test --prefix backend

      # 5️⃣ Log in to Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASS }}

      # 6️⃣ Build, Tag & Push Docker Image
      - name: Build, Tag and Push Docker Image
        run: |
          # Build local image
          docker build -t mybackend:latest ./backend

          # Debug: List images (optional)
          docker images

          # Tag image for Docker Hub
          docker tag mybackend:latest ${{ secrets.DOCKER_USER }}/mybackend:latest

          # Push image to Docker Hub
          docker push ${{ secrets.DOCKER_USER }}/mybackend:latest
